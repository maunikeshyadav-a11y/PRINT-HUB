<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="container py-5"><div class="card p-4 mx-auto login-card"><h2>Admin Login</h2><input id="user" class="form-control my-2" placeholder="Email / Username"><input id="pass" type="password" class="form-control my-2" placeholder="Password"><button id="login" class="btn btn-primary w-100">Login</button><div id="err" class="text-danger mt-3"></div></div></div><script>document.getElementById('login').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});const x=await r.json();if(r.ok){localStorage.token=x.token;location='admin-dashboard.html'}else document.getElementById('err').textContent=x.error||'Login failed'}</script></body></html>
