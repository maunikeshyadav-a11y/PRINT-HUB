<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload • Nikesh Print Hub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script></head><body><div class="container py-4"><a href="index.html" class="brand">NIKESH PRINT HUB</a><div class="card p-4 mt-4 mx-auto upload-card"><div id="station" class="alert alert-info">Detecting station…</div><h2>Upload Your Document</h2><p class="text-secondary">PDF, JPG, JPEG or PNG • Maximum 25 MB</p><input id="file" class="form-control" type="file" accept=".pdf,.jpg,.jpeg,.png"><div id="fileInfo" class="mt-3"></div><div id="preview" class="preview mt-3"></div><hr><div class="row g-3"><div class="col-6"><label class="form-label">Copies</label><input id="copies" type="number" min="1" max="99" value="1" class="form-control"></div><div class="col-6"><label class="form-label">Paper Size</label><select id="paper" class="form-select"><option>A4</option><option>A3</option><option>Letter</option><option>Legal</option></select></div><div class="col-6"><label class="form-label">Orientation</label><select id="orientation" class="form-select"><option>Auto</option><option>Portrait</option><option>Landscape</option></select></div><div class="col-6"><label class="form-label">Color</label><select id="color" class="form-select"><option>Black & White</option><option>Color</option></select></div><div class="col-6"><label class="form-label">Print Sides</label><select id="duplex" class="form-select"><option>Single Side</option><option>Double Side</option></select></div><div class="col-6"><label class="form-label">Pages</label><select id="pagesMode" class="form-select"><option value="all">All Pages</option><option value="custom">Custom Pages</option></select></div><div class="col-12"><input id="customPages" class="form-control" placeholder="Example: 1-3,5,8" disabled></div></div><button id="send" class="btn btn-primary btn-lg w-100 mt-4" disabled>SEND TO PRINT</button><div id="result" class="mt-3"></div></div></div><script src="js/upload.js"></script></body></html>
